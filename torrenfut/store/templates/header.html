{% load static %}
<header class="header">
    <div class="header-left">
        <a href="/store" style="display: flex; align-items: center; text-decoration: none; color: white;">
            <img src="/media/logo/logo_torrenfut.png" alt="Logo TorrenFut" style="height: 40px; margin-right: 10px;">
            <div>
                <h1 style="margin: 0; font-size: 24px;">TORRENFUT</h1>
                <span style="font-size: 12px; font-weight: normal; letter-spacing: 1px;">A EMOÇÃO DO ESPORTE EM CADA CAIXA</span>
            </div>
        </a>
    </div>
    <div class="header-right">
        <a href="{% url 'planos' %}" class="button">Clube de Assinatura</a>
        <a href="{% url 'mystery_box' %}" class="button">Mystery Box</a>

        {% if user.is_authenticated %}
            <a href="{% url 'perfil' %}" style="text-decoration: none;">
                <span>{{ user.first_name }} {{ user.last_name }}</span>
            </a>
            <a href="{% url 'ver_carrinho' %}" class="button carrinho-link" style="margin-left: 15px;">Ir para o Carrinho
                <span id="carrinho-indicador">({{ carrinho_quantidade }})</span></a>
        {% else %}
            <a href="{% url 'login' %}" class="button">Login</a>
            <a href="{% url 'cadastro' %}" class="button">Cadastro</a>
        {% endif %}
    </div>
</header>
